<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>@webarkit/camera-view — Interactive Demo</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    sans-serif;
            }
            body {
                margin: 0;
                padding: 1.5rem;
                background: #0f172a;
                color: #e2e8f0;
            }
            h1 {
                margin: 0 0 0.25rem;
                font-size: 1.35rem;
            }
            p.sub {
                margin: 0 0 1rem;
                color: #94a3b8;
                font-size: 0.9rem;
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem;
                align-items: center;
                padding: 0.75rem;
                background: #1e293b;
                border-radius: 0.5rem;
                margin-bottom: 1rem;
            }
            label {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                font-size: 0.875rem;
            }
            input,
            select,
            button {
                padding: 0.35rem 0.6rem;
                border-radius: 0.375rem;
                border: 1px solid #334155;
                background: #0f172a;
                color: #e2e8f0;
                font-size: 0.875rem;
            }
            button {
                cursor: pointer;
                background: #2563eb;
                border-color: #1d4ed8;
                font-weight: 600;
            }
            button.secondary {
                background: #334155;
                border-color: #475569;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 1rem;
            }
            .panel {
                background: #1e293b;
                border-radius: 0.5rem;
                padding: 0.75rem;
            }
            .panel h2 {
                margin: 0 0 0.5rem;
                font-size: 0.95rem;
                color: #cbd5e1;
            }
            video,
            canvas {
                max-width: 100%;
                height: auto;
                border: 1px solid #334155;
                border-radius: 0.25rem;
                background: #000;
            }
            pre {
                margin: 0;
                padding: 0.75rem;
                background: #0f172a;
                border-radius: 0.375rem;
                font-size: 0.8rem;
                overflow-x: auto;
            }
        </style>
    </head>
    <body>
        <h1>@webarkit/camera-view</h1>
        <p class="sub">
            Inspect camera opening, the 320&times;240 4:3 letterbox, <code>rotatePortrait</code>,
            and <code>FrameGeometry</code>.
        </p>

        <div class="controls">
            <label>
                Facing:
                <select id="facingMode">
                    <option value="environment">environment</option>
                    <option value="user">user</option>
                </select>
            </label>
            <label>
                Camera label:
                <input id="cameraLabel" type="text" placeholder="e.g. Logitech" size="14" />
            </label>
            <label>
                Target FPS:
                <input
                    id="targetFrameRate"
                    type="number"
                    value="30"
                    min="1"
                    max="120"
                    style="width: 4rem"
                />
            </label>
            <label>
                <input id="rotatePortrait" type="checkbox" checked />
                rotatePortrait
            </label>
            <button id="startBtn" type="button">Start Camera</button>
            <button id="stopBtn" class="secondary" type="button" disabled>Destroy</button>
        </div>

        <div class="grid">
            <div class="panel">
                <h2>Camera &lt;video&gt;</h2>
                <video id="video" autoplay muted playsinline></video>
            </div>
            <div class="panel">
                <h2>Process frame (<code>getImage()</code> + footprint overlay)</h2>
                <canvas id="preview" width="320" height="240"></canvas>
            </div>
            <div class="panel">
                <h2>State &amp; <code>view.geometry</code></h2>
                <pre id="info">Click "Start Camera" to initialize CameraView.</pre>
            </div>
        </div>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
